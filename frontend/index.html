<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Main Page</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <nav class="navbar">
        <button id="button-loans">Loans</button>
        <button id="button-inventory">Inventory</button>
        <button id="button-clients">Clients</button>
        <button id="button-menu">Menu</button>
    </nav>
    <section class="toolbar">
        <button class="new-loan">New Loan</button>
        <input type="text" placeholder="Search" class="search-box">
        <button class="search-btn">🔍</button>
        <button class="filters">Filters</button>
    </section>
    <main>
        <!-- Loans View -->
        <div class="table-container" id="loans-view">
            <table class="main-table">
                <thead>
                    <tr>
                        <th>Loan ID</th>
                        <th>Client</th>
                        <th>Item</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>10001</td><td>Mario Sale</td><td>Laptop</td><td>Active</td><td><button>Details</button></td></tr>
                    <tr><td>10002</td><td>Sale Mario</td><td>Tablet</td><td>Closed</td><td><button>Details</button></td></tr>
                    <tr><td>10003</td><td>Marius Salis</td><td>Monitor</td><td>Active</td><td><button>Details</button></td></tr>
                </tbody>
            </table>
        </div>
        <!-- Inventory View -->
        <div class="table-container hidden" id="inventory-view">
            <table class="main-table">
                <thead>
                    <tr>
                        <th>Item ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Location</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>20001</td><td>Notebook</td><td>Electronics</td><td>Available</td><td>Lab 1</td><td><button>Details</button></td></tr>
                    <tr><td>20002</td><td>Tablet</td><td>Electronics</td><td>Loaned</td><td>Lab 2</td><td><button>Details</button></td></tr>
                    <tr><td>20003</td><td>Monitor</td><td>Electronics</td><td>Available</td><td>Lab 3</td><td><button>Details</button></td></tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
